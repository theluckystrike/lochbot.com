<body>
    <div class="container">
        <header>
            <h1>Encoding Converter</h1>
            <p>Convert between ASCII, UTF-8, URL, HTML, Base64, Hex, and Binary formats</p>
        </header>

        <div class="input-section">
            <div class="tabs">
                <button class="tab-btn active" data-mode="text">Text Input</button>
                <button class="tab-btn" data-mode="hex">Hex Input</button>
            </div>

            <div class="input-group">
                <label>Input Text</label>
                <textarea id="inputText" placeholder="Enter text to encode...">Hello, World!</textarea>
            </div>

            <div class="button-group">
                <button onclick="convertEncodings()">Convert All Formats</button>
                <button class="secondary-btn" onclick="clearAll()">Clear</button>
            </div>

            <div class="char-info" id="charInfo"></div>
        </div>

        <div class="encoding-grid" id="encodingGrid"></div>
    </div>

    <footer>
        © 2026 lochbot.com — Cybersecurity Tools
    </footer>

    <script>
        const encodings = [
            { name: 'ASCII', encode: textToAscii },
            { name: 'UTF-8', encode: textToUtf8 },
            { name: 'URL Encoded', encode: textToUrlEncoded },
            { name: 'HTML Entities', encode: textToHtmlEntities },
            { name: 'Base64', encode: textToBase64 },
            { name: 'Hexadecimal', encode: textToHex },
            { name: 'Binary', encode: textToBinary }
        ];

        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const inputText = document.getElementById('inputText');
                if (this.dataset.mode === 'hex') {
                    inputText.placeholder = 'Enter hexadecimal (space-separated or continuous)...';
                } else {
                    inputText.placeholder = 'Enter text to encode...';
                }
            });
        });

        function textToAscii(text) {
            return Array.from(text).map(c => c.charCodeAt(0)).join(' ');
        }

        function textToUtf8(text) {
            const encoder = new TextEncoder();
            const bytes = encoder.encode(text);
            return Array.from(bytes).map(b => b.toString(10)).join(' ');
        }

        function textToUrlEncoded(text) {
            return encodeURIComponent(text);
        }

        function textToHtmlEntities(text) {
            const div = document.createElement('div');
            div.textContent = text;
            let html = div.innerHTML;
            return html.replace(/[\u00A0-\u9999]/g, (i) => {
                return '&#' + i.charCodeAt(0) + ';';
            });
        }

        function textToBase64(text) {
            return btoa(unescape(encodeURIComponent(text)));
        }

        function textToHex(text) {
            return Array.from(text).map(c => {
                const hex = c.charCodeAt(0).toString(16).toUpperCase();
                return hex.padStart(2, '0');
            }).join(' ');
        }

        function textToBinary(text) {
            return Array.from(text).map(c => {
                return c.charCodeAt(0).toString(2).padStart(8, '0');
            }).join(' ');
        }

        function hexToText(hexStr) {
            try {
                const hex = hexStr.replace(/\s/g, '');
                let text = '';
                for (let i = 0; i < hex.length; i += 2) {
                    text += String.fromCharCode(parseInt(hex.substr(i, 2), 16));
                }
                return text;
            } catch (e) {
                return 'Invalid hex input';
            }
        }

        function base64ToText(b64) {
            try {
                return decodeURIComponent(atob(b64).split('').map(c => {
                    return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
                }).join(''));
            } catch (e) {
                return 'Invalid base64';
            }
        }

        function convertEncodings() {
            const inputText = document.getElementById('inputText').value;
            const isHexMode = document.querySelector('.tab-btn.active').dataset.mode === 'hex';

            let textToConvert = inputText;
            if (isHexMode) {
                textToConvert = hexToText(inputText);
            }

            if (!textToConvert) {
                document.getElementById('encodingGrid').innerHTML = '';
                document.getElementById('charInfo').innerHTML = '';
                return;
            }

            let grid = '';
            for (const enc of encodings) {
                try {
                    const result = enc.encode(textToConvert);
                    const uniqueId = 'enc_' + enc.name.replace(/\s/g, '_');
                    grid += `
                        <div class="encoding-card">
                            <div class="encoding-label">${enc.name}</div>
                            <div class="encoding-output" id="${uniqueId}">
                                ${escapeHtml(result)}
                                <button class="copy-btn" onclick="copyToClipboard('${uniqueId}', this)">Copy</button>
                            </div>
                        </div>
                    `;
                } catch (e) {
                    grid += `
                        <div class="encoding-card">
                            <div class="encoding-label">${enc.name}</div>
                            <div class="encoding-output" style="color: #ef4444;">Error encoding</div>
                        </div>
                    `;
                }
            }

            document.getElementById('encodingGrid').innerHTML = grid;

            // Show character info
            const charInfo = `
                <strong>Length:</strong> ${textToConvert.length} characters |
                <strong>Bytes (UTF-8):</strong> ${new TextEncoder().encode(textToConvert).length} |
                <strong>Lines:</strong> ${textToConvert.split('\n').length}
            `;
            document.getElementById('charInfo').innerHTML = charInfo;
        }

        function copyToClipboard(elementId, btn) {
            const element = document.getElementById(elementId);
            const text = element.textContent.replace('Copy', '').trim();

            navigator.clipboard.writeText(text).then(() => {
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                btn.classList.add('copied');
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.classList.remove('copied');
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
            });
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function clearAll() {
            document.getElementById('inputText').value = '';
            document.getElementById('encodingGrid').innerHTML = '';
            document.getElementById('charInfo').innerHTML = '';
        }

        // Auto-convert on input
        document.getElementById('inputText').addEventListener('input', convertEncodings);

        // Initial conversion
        convertEncodings();
    </script>
</body>
