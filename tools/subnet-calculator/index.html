<body>
    <div class="container">
        <header>
            <h1>Subnet Calculator</h1>
            <p>Calculate IPv4 subnets with CIDR notation and network analysis</p>
        </header>

        <div class="input-section">
            <div class="input-row">
                <div class="input-group">
                    <label for="ipInput">IP Address</label>
                    <input type="text" id="ipInput" placeholder="192.168.1.1" value="192.168.1.0">
                </div>
                <div class="input-group">
                    <label for="cidrInput">CIDR Notation (/)</label>
                    <input type="number" id="cidrInput" placeholder="24" value="24" min="1" max="32">
                </div>
            </div>
            <div style="display: flex; gap: 10px;">
                <button onclick="calculateSubnet()">Calculate</button>
                <button class="secondary-btn" onclick="clearResults()">Clear</button>
            </div>
        </div>

        <div class="results-section" id="resultsSection">
            <div id="errorMessage"></div>
            <div id="resultContent"></div>
        </div>
    </div>

    <footer>
        © 2026 lochbot.com — Cybersecurity Tools
    </footer>

    <script>
        function ipToDecimal(ip) {
            const parts = ip.split('.');
            if (parts.length !== 4) return null;
            let decimal = 0;
            for (let i = 0; i < 4; i++) {
                const num = parseInt(parts[i]);
                if (isNaN(num) || num < 0 || num > 255) return null;
                decimal = decimal * 256 + num;
            }
            return decimal;
        }

        function decimalToIp(decimal) {
            const a = (decimal >>> 24) & 0xFF;
            const b = (decimal >>> 16) & 0xFF;
            const c = (decimal >>> 8) & 0xFF;
            const d = decimal & 0xFF;
            return `${a}.${b}.${c}.${d}`;
        }

        function decimalToBinary(decimal) {
            return (decimal >>> 0).toString(2).padStart(32, '0');
        }

        function calculateSubnet() {
            const ip = document.getElementById('ipInput').value.trim();
            const cidr = parseInt(document.getElementById('cidrInput').value);

            const errorDiv = document.getElementById('errorMessage');
            const contentDiv = document.getElementById('resultContent');
            const resultsSection = document.getElementById('resultsSection');

            errorDiv.innerHTML = '';
            contentDiv.innerHTML = '';

            if (cidr < 1 || cidr > 32) {
                errorDiv.innerHTML = '<div class="error-message">CIDR must be between 1 and 32</div>';
                resultsSection.classList.add('active');
                return;
            }

            const ipDecimal = ipToDecimal(ip);
            if (ipDecimal === null) {
                errorDiv.innerHTML = '<div class="error-message">Invalid IP address format</div>';
                resultsSection.classList.add('active');
                return;
            }

            // Calculate network address
            const maskBits = 0xFFFFFFFF << (32 - cidr);
            const networkDecimal = ipDecimal & maskBits;
            const networkIp = decimalToIp(networkDecimal);

            // Calculate broadcast address
            const hostBits = (1 << (32 - cidr)) - 1;
            const broadcastDecimal = networkDecimal | hostBits;
            const broadcastIp = decimalToIp(broadcastDecimal);

            // Calculate usable host range
            const firstUsable = networkDecimal + 1;
            const lastUsable = broadcastDecimal - 1;
            const firstUsableIp = decimalToIp(firstUsable);
            const lastUsableIp = decimalToIp(lastUsable);
            const usableHosts = Math.max(0, lastUsable - firstUsable + 1);

            // Calculate subnet mask
            const subnetMaskDecimal = maskBits;
            const subnetMask = decimalToIp(subnetMaskDecimal);

            // Calculate wildcard mask
            const wildcardDecimal = ~maskBits >>> 0;
            const wildcardMask = decimalToIp(wildcardDecimal);

            // Calculate next and previous subnets
            const subnetSize = 1 << (32 - cidr);
            const nextSubnetDecimal = broadcastDecimal + 1;
            const prevSubnetDecimal = networkDecimal - subnetSize;
            const nextSubnet = decimalToIp(nextSubnetDecimal);
            const prevSubnet = decimalToIp(Math.max(0, prevSubnetDecimal));

            const html = `
                <div class="info-box">
                    <strong>Network:</strong> ${networkIp}/${cidr} |
                    <strong>Hosts:</strong> ${usableHosts} |
                    <strong>Mask:</strong> ${subnetMask}
                </div>

                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Network Address</div>
                        <div class="result-value">${networkIp}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Broadcast Address</div>
                        <div class="result-value">${broadcastIp}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Subnet Mask</div>
                        <div class="result-value">${subnetMask}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Wildcard Mask</div>
                        <div class="result-value">${wildcardMask}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Usable Hosts</div>
                        <div class="result-value">${usableHosts}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">IP Class</div>
                        <div class="result-value">${getIpClass(ip)}</div>
                    </div>
                </div>

                <h3 style="color: #f97316; margin: 20px 0 15px 0; font-size: 16px;">Usable Host Range</h3>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">First Usable IP</div>
                        <div class="result-value">${firstUsableIp}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Last Usable IP</div>
                        <div class="result-value">${lastUsableIp}</div>
                    </div>
                </div>

                <h3 style="color: #f97316; margin: 20px 0 15px 0; font-size: 16px;">Binary Representation</h3>
                <div class="binary-row">
                    <div class="binary-label">Network Address (Binary)</div>
                    <div class="binary-value">${formatBinary(decimalToBinary(networkDecimal))}</div>
                </div>
                <div class="binary-row">
                    <div class="binary-label">Subnet Mask (Binary)</div>
                    <div class="binary-value">${formatBinary(decimalToBinary(subnetMaskDecimal))}</div>
                </div>
                <div class="binary-row">
                    <div class="binary-label">Broadcast Address (Binary)</div>
                    <div class="binary-value">${formatBinary(decimalToBinary(broadcastDecimal))}</div>
                </div>

                <h3 style="color: #f97316; margin: 20px 0 15px 0; font-size: 16px;">Adjacent Subnets</h3>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-label">Previous Subnet</div>
                        <div class="result-value">${prevSubnet}/${cidr}</div>
                    </div>
                    <div class="result-item">
                        <div class="result-label">Next Subnet</div>
                        <div class="result-value">${nextSubnet}/${cidr}</div>
                    </div>
                </div>
            `;

            contentDiv.innerHTML = html;
            resultsSection.classList.add('active');
        }

        function formatBinary(binary) {
            return binary.match(/.{1,8}/g).join(' ');
        }

        function getIpClass(ip) {
            const firstOctet = parseInt(ip.split('.')[0]);
            if (firstOctet < 128) return 'Class A';
            if (firstOctet < 192) return 'Class B';
            if (firstOctet < 224) return 'Class C';
            if (firstOctet < 240) return 'Class D (Multicast)';
            return 'Class E (Reserved)';
        }

        function clearResults() {
            document.getElementById('ipInput').value = '192.168.1.0';
            document.getElementById('cidrInput').value = '24';
            document.getElementById('resultsSection').classList.remove('active');
            document.getElementById('resultContent').innerHTML = '';
            document.getElementById('errorMessage').innerHTML = '';
        }

        // Auto-calculate on enter key
        document.getElementById('ipInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calculateSubnet();
        });
        document.getElementById('cidrInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') calculateSubnet();
        });
    </script>
